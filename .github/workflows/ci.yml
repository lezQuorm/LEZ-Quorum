name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Risc0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (dev-mode proofs for speed; real proofs gated by RISC0_DEV_MODE=0)
        run: RISC0_DEV_MODE=1 cargo test --workspace

  real-proof:
    name: real threshold proof (RISC0_DEV_MODE=0)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Risc0 toolchain
        run: |
          curl -L https://risczero.com/install | bash
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2

      - name: Generate + verify a real 2-of-3 threshold proof
        run: RISC0_DEV_MODE=0 cargo run -p quorum-prover --example prove_threshold --release
