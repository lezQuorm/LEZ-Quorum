name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: fmt · clippy · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Risc0 toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-risczero
            ~/.rustup/toolchains/risc0
            ~/.rustup/update-hashes/risc0
          key: risc0-3.0.5-rust-1.97.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Risc0 toolchain (pinned)
        run: |
          if ! cargo risczero --version 2>/dev/null | grep -Fq '3.0.5'; then
            cargo install cargo-risczero --version 3.0.5 --locked
          fi
          if ! rustc +risc0 --version 2>/dev/null | grep -Fq '1.97.0'; then
            cargo risczero install --version 1.97.0
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (dev-mode proofs for speed; real proofs gated by RISC0_DEV_MODE=0)
        run: RISC0_DEV_MODE=1 cargo test --workspace

  real-proof:
    name: real threshold proof (RISC0_DEV_MODE=0)
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Risc0 toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-risczero
            ~/.rustup/toolchains/risc0
            ~/.rustup/update-hashes/risc0
          key: risc0-3.0.5-rust-1.97.0-${{ runner.os }}-${{ runner.arch }}

      - name: Install Risc0 toolchain (pinned)
        run: |
          if ! cargo risczero --version 2>/dev/null | grep -Fq '3.0.5'; then
            cargo install cargo-risczero --version 3.0.5 --locked
          fi
          if ! rustc +risc0 --version 2>/dev/null | grep -Fq '1.97.0'; then
            cargo risczero install --version 1.97.0
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Generate + verify a real 2-of-3 threshold proof
        run: RISC0_DEV_MODE=0 cargo run -p quorum-prover --example prove_threshold --release
