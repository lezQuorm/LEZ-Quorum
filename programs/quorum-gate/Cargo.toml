[package]
name = "quorum-gate-methods"
description = "Embedded SPEL gate for Quorum threshold receipt assumptions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
risc0-build.workspace = true

[dev-dependencies]
spel-framework = { git = "https://github.com/FidelCoder/spel.git", rev = "1fef85203c3130676a49aaed1b4387d16be9fe94" }
spel-framework-core = { git = "https://github.com/FidelCoder/spel.git", rev = "1fef85203c3130676a49aaed1b4387d16be9fe94", features = ["idl-gen"] }
spel-client-gen = { git = "https://github.com/FidelCoder/spel.git", rev = "1fef85203c3130676a49aaed1b4387d16be9fe94" }
quorum-gate-core = { path = "../../crates/quorum-gate-core" }
token-core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2", package = "token_core" }
risc0-zkvm.workspace = true

[package.metadata.risc0]
methods = ["guest"]
