[workspace]
resolver = "2"
members = [
    "crates/quorum-core",
    "crates/lez-compat",
    # Chunk 3: "crates/quorum-circuit",
    # Chunk 3: "crates/quorum-image-id",
    # Chunk 5: "crates/quorum-sdk",
    # Chunk 5: "crates/quorum-cli",
    # Chunk 4: "programs/quorum-gate",
]
default-members = ["crates/quorum-core", "crates/lez-compat"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FidelCoder/LEZ-Quorum"
rust-version = "1.91"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
