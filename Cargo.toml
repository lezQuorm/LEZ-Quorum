[workspace]
resolver = "2"
members = [
    "crates/quorum-core",
    "crates/lez-compat",
    "crates/quorum-circuit",
    "crates/quorum-prover",
    "crates/quorum-image-id",
    "guests/quorum-threshold",
    # Chunk 5: "crates/quorum-sdk",
    # Chunk 5: "crates/quorum-cli",
    # Chunk 4: "programs/quorum-gate",
]
exclude = [
    "guests/quorum-threshold/guest",
]
default-members = [
    "crates/quorum-core",
    "crates/lez-compat",
    "crates/quorum-circuit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FidelCoder/LEZ-Quorum"
rust-version = "1.91"

[workspace.dependencies]
quorum-core = { path = "crates/quorum-core" }
lez-compat = { path = "crates/lez-compat" }
quorum-circuit = { path = "crates/quorum-circuit" }
quorum-prover = { path = "crates/quorum-prover" }
quorum-image-id = { path = "crates/quorum-image-id" }
quorum-threshold-methods = { path = "guests/quorum-threshold" }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std", "client"] }
risc0-build = "=3.0.5"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
bincode = "1.3"
base64 = "0.22"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
