[package]
name = "quorum-cli"
description = "Quorum CLI: create, propose, approve (client-side proofs), execute, rotate (LP-0002)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "quorum"
path = "src/main.rs"

[dependencies]
quorum-sdk = { path = "../quorum-sdk" }
quorum-core = { path = "../quorum-core" }
quorum-circuit = { path = "../quorum-circuit" }
quorum-gate-core = { path = "../quorum-gate-core" }
quorum-prover = { path = "../quorum-prover" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"

[lints]
workspace = true
