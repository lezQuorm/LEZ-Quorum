[package]
name = "quorum-cli"
description = "Offline-first CLI for Quorum treasury operations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "quorum"
path = "src/main.rs"

[dependencies]
quorum-sdk = { path = "../quorum-sdk" }
quorum-core = { path = "../quorum-core" }
quorum-circuit = { path = "../quorum-circuit" }
quorum-gate-core = { path = "../quorum-gate-core" }
quorum-prover = { path = "../quorum-prover" }
quorum-composer = { path = "../quorum-composer", features = ["network"] }
quorum-gate-methods = { path = "../../programs/quorum-gate" }
common = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
lee-core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2", package = "lee_core", features = ["host"] }
token_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.2" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "2"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
